name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ls -la
          unzip -o ck-auto-android-3.zip -d android
          ls android
      - name: Use cloud settings from the repo
        run: |
          if [ -f firebase-config.js ]; then
            mkdir -p android/app/src/main/assets
            cp firebase-config.js android/app/src/main/assets/firebase-config.js
            echo "Using firebase-config.js from the repo"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: CK-Auto-APK
          path: android/app/build/outputs/apk/release/app-release.apk
