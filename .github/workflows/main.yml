name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          for z in *.zip; do
            if unzip -l "$z" | grep -q "settings.gradle.kts"; then
              echo "Using $z"
              unzip -o "$z" -d android
              exit 0
            fi
          done
          echo "No source zip found"; ls -la; exit 1
      - name: Use cloud settings from the repo
        run: |
          if [ -f firebase-config.js ]; then
            mkdir -p android/app/src/main/assets
            cp firebase-config.js android/app/src/main/assets/firebase-config.js
            echo "Using firebase-config.js from the repo"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: CK-Auto-APK
          path: android/app/build/outputs/apk/release/app-release.apk
