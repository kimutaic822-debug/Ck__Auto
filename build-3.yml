name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest source zip
        run: |
          git ls-files '*.zip' > /tmp/zips.txt
          best=""; bt=0
          while IFS= read -r z; do
            if unzip -l "$z" | grep -q "settings.gradle.kts"; then
              t=$(git log -1 --format=%ct -- "$z")
              if [ "$t" -ge "$bt" ]; then best="$z"; bt="$t"; fi
            fi
          done < /tmp/zips.txt
          if [ -z "$best" ]; then echo "No source zip found"; ls -la; exit 1; fi
          echo "Using $best"
          unzip -o "$best" -d android
      - name: Fix gradle root files
        run: |
          cat > android/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOT
          cat > android/settings.gradle.kts <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CKAuto"
          include(":app")
          EOT
      - name: Bump version so the phone upgrades in place
        run: sed -i "s/versionCode = [0-9]*/versionCode = $((100 + ${{ github.run_number }}))/" android/app/build.gradle.kts
      - name: Use cloud settings from the repo
        run: |
          if [ -f firebase-config.js ]; then
            mkdir -p android/app/src/main/assets
            cp firebase-config.js android/app/src/main/assets/firebase-config.js
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: CK-Auto-APK
          path: android/app/build/outputs/apk/release/app-release.apk
